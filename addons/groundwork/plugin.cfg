[plugin]

name="Godot-Groundwork"
description="Real-world terrain and OpenStreetMap importer: pick an area on a map and generate a walkable scene (terrain mesh with LOD, collision, aerial imagery, buildings, roads and water) built from standard Godot nodes. Requires Godot 4.4+."
author="Groundwork contributors"
version="1.0.0"
script="plugin.gd"
